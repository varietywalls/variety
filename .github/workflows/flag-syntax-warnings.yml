name: Flag Python SyntaxWarning

on: [push, pull_request]

jobs:
  compileall:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Flag Python SyntaxWarning
      run: |
        python3 -W error::SyntaxWarning -m compileall variety/ jumble/
